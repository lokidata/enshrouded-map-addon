# Generated by the site's frontend/nginx/40-addon.sh for each add-on container (here key "main", from
# ADDONS=main=http://addon:8000 or the alias ADDON_URL=http://addon:8000). ADDON_URL is origin only; one
# trailing slash is tolerated there (not in ADDONS values). The browser path is /addon/<key>/; the prefix is
# stripped so the add-on keeps serving /addon/...
location ^~ /addon/main/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $addon_upstream "http://addon:8000";
    rewrite ^/addon/main/(.*)$ /addon/$1 break;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $addon_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
}
