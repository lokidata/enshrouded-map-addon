<header class="top">
  <h1>{{ 'app.title' | t }}</h1>
  <nav [attr.aria-label]="'nav.label' | t">
    <a
      routerLink="/"
      routerLinkActive="on"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >{{ 'nav.server' | t }}</a
    >
    <a routerLink="/mods" routerLinkActive="on" ariaCurrentWhenActive="page">{{
      'nav.mods' | t
    }}</a>
  </nav>
  <div class="row" role="group" [attr.aria-label]="'lang.label' | t">
    <button
      type="button"
      class="pill"
      lang="fr"
      [attr.aria-pressed]="i18n.lang() === 'fr'"
      (click)="i18n.set('fr')"
    >
      FR
    </button>
    <button
      type="button"
      class="pill"
      lang="en"
      [attr.aria-pressed]="i18n.lang() === 'en'"
      (click)="i18n.set('en')"
    >
      EN
    </button>
  </div>
  <span class="pill state" [class.up]="status.state() === 'running'" role="status">{{
    label(status.state())
  }}</span>
</header>
<main>
  <router-outlet />
</main>
<app-confirm-dialog />
