version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7} # new releases wait a week: gives time for compromised ones to be pulled
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      python: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      npm: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      # Angular pins TypeScript (~6.0): a TypeScript major breaks `npm ci`. Move it with Angular.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    ignore:
      # Node: odd majors are not LTS. Move to the next LTS by hand (CI and the image build on it).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
